apiVersion: apps/v1
kind: Deployment
metadata: { name: worker }
spec:
  replicas: 1                     # exatamente 1: ver justificativa no README
  strategy: { type: Recreate }    # nunca dois workers ao mesmo tempo, nem durante update
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers:
        - name: worker
          image: gsun2005/saude-worker:v1
          ports: [{ containerPort: 8080 }]
          env: [{ name: MONGO_URL, value: "mongodb://mongo:27017" }]
---
apiVersion: v1
kind: Service
metadata: { name: worker }
spec:
  type: ClusterIP
  selector: { app: worker }
  ports: [{ port: 8080, targetPort: 8080 }]
